version: "1"
services:
  - type: web
    name: studydock-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: ENABLE_DEMO_RESET
        value: "false"
      - key: CLIENT_URL
        value: https://studydock-eta.vercel.app,http://localhost:5173
      - key: SUPABASE_URL
        value: https://deunnaibdmlohgtnxdsz.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GMAIL_USER
        value: kushalkumar78k@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ENTRY_CODE_SECRET
        generateValue: true
